name: offline_music_player
description: "A simple offline music player app built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.43
  audio_service: ^0.18.14
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  file_picker: ^8.1.7
  on_audio_query: 2.9.0
  audio_session: ^0.1.21
  rxdart: ^0.28.0
  palette_generator: ^0.3.3+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/sample_songs/
